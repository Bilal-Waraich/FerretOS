<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"
     font-family="Arial, Helvetica, sans-serif">
<style>
  .bg{fill:#ffffff} .fg{fill:#1a1a1a} .muted{fill:#666666} .rule{stroke:#d9d9d9}
  .blk{fill:#f2f2f2;stroke:#bfbfbf} .hl{fill:#76b900;stroke:#76b900} .hltext{fill:#000000}
  .region{fill:none;stroke:#76b900} .regiontext{fill:#4d7a00} .line{stroke:#808080;fill:none} .head{fill:#808080}
  .hw{fill:#e6e6e6;stroke:#bfbfbf}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .fg{fill:#ededed} .muted{fill:#a0a0a0} .rule{stroke:#30363d}
    .blk{fill:#1c2128;stroke:#444c56} .hw{fill:#22272e;stroke:#444c56}
    .regiontext{fill:#76b900} .line{stroke:#8b949e} .head{fill:#8b949e}
  }
  text{font-size:12px} .name{font-size:13px;font-weight:700} .row{font-size:12px;font-weight:700;letter-spacing:.08em} .sub{font-size:11px}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="960" height="500"/>

<!-- Row labels -->
<text class="fg row" x="20" y="64">BUILD</text>
<text class="muted sub" x="20" y="80">host</text>
<text class="fg row" x="20" y="186">TASKS</text>
<text class="muted sub" x="20" y="202">user mode</text>
<text class="fg row" x="20" y="320">KERNEL</text>
<text class="muted sub" x="20" y="336">machine mode</text>
<text class="fg row" x="20" y="416">HARDWARE</text>
<text class="muted sub" x="20" y="432">QEMU virt</text>

<!-- Build row -->
<rect class="blk" x="170" y="40" width="170" height="56" rx="2"/>
<text class="fg name" x="255" y="64" text-anchor="middle">Task declarations</text>
<text class="muted sub" x="255" y="82" text-anchor="middle">tasks/*.oml</text>
<rect class="blk" x="370" y="40" width="170" height="56" rx="2"/>
<text class="fg name" x="455" y="64" text-anchor="middle">OML transpiler</text>
<text class="muted sub" x="455" y="82" text-anchor="middle">Rust task statics</text>
<rect class="hl" x="570" y="40" width="170" height="56" rx="2"/>
<text class="hltext name" x="655" y="64" text-anchor="middle">Contention graph</text>
<text class="hltext sub" x="655" y="82" text-anchor="middle">MaxInheritedPriority</text>
<rect class="blk" x="770" y="40" width="170" height="56" rx="2"/>
<text class="fg name" x="855" y="64" text-anchor="middle">Priority tables</text>
<text class="muted sub" x="855" y="82" text-anchor="middle">linked into the image</text>
<line class="line" x1="340" y1="68" x2="368" y2="68" stroke-width="1.25" marker-end="url(#a)"/>
<line class="line" x1="540" y1="68" x2="568" y2="68" stroke-width="1.25" marker-end="url(#a)"/>
<line class="line" x1="740" y1="68" x2="768" y2="68" stroke-width="1.25" marker-end="url(#a)"/>

<line class="rule" x1="20" y1="118" x2="940" y2="118" stroke-width="1"/>

<!-- Task row: each task inside its PMP region -->
<rect class="region" x="170" y="136" width="243" height="104" rx="2" stroke-width="1.25"/>
<text class="regiontext sub" x="180" y="151">PMP region · 4 KB</text>
<rect class="blk" x="182" y="160" width="219" height="66" rx="2"/>
<text class="fg name" x="291" y="187" text-anchor="middle">sensor_reader</text>
<text class="muted sub" x="291" y="206" text-anchor="middle">priority 3 · 10 ms period</text>

<rect class="region" x="433" y="136" width="243" height="104" rx="2" stroke-width="1.25"/>
<text class="regiontext sub" x="443" y="151">PMP region · 4 KB</text>
<rect class="blk" x="445" y="160" width="219" height="66" rx="2"/>
<text class="fg name" x="554" y="187" text-anchor="middle">filter</text>
<text class="muted sub" x="554" y="206" text-anchor="middle">priority 2 · moving average</text>

<rect class="region" x="696" y="136" width="243" height="104" rx="2" stroke-width="1.25"/>
<text class="regiontext sub" x="706" y="151">PMP region · 4 KB</text>
<rect class="blk" x="708" y="160" width="219" height="66" rx="2"/>
<text class="fg name" x="817" y="187" text-anchor="middle">uart_logger</text>
<text class="muted sub" x="817" y="206" text-anchor="middle">priority 1 · slow output</text>

<!-- Privilege boundary -->
<line class="line" x1="170" y1="262" x2="940" y2="262" stroke-width="1" stroke-dasharray="5 4"/>
<text class="muted sub" x="940" y="256" text-anchor="end">privilege boundary (ecall, interrupts)</text>

<!-- Kernel row -->
<rect class="blk" x="170" y="282" width="118" height="78" rx="2"/>
<text class="fg name" x="229" y="314" text-anchor="middle">Trap entry</text>
<text class="muted sub" x="229" y="332" text-anchor="middle">per-task</text>
<text class="muted sub" x="229" y="346" text-anchor="middle">kernel stack</text>

<rect class="blk" x="300" y="282" width="118" height="78" rx="2"/>
<text class="fg name" x="359" y="314" text-anchor="middle">Syscalls</text>
<text class="muted sub" x="359" y="332" text-anchor="middle">pointer</text>
<text class="muted sub" x="359" y="346" text-anchor="middle">validation</text>

<rect class="blk" x="431" y="282" width="118" height="78" rx="2"/>
<text class="fg name" x="490" y="314" text-anchor="middle">Channels</text>
<text class="muted sub" x="490" y="332" text-anchor="middle">blocking,</text>
<text class="muted sub" x="490" y="346" text-anchor="middle">one-to-one</text>

<rect class="hl" x="561" y="282" width="118" height="78" rx="2"/>
<text class="hltext name" x="620" y="314" text-anchor="middle">CA-PIP</text>
<text class="hltext sub" x="620" y="332" text-anchor="middle">fixed effective</text>
<text class="hltext sub" x="620" y="346" text-anchor="middle">priorities</text>

<rect class="hl" x="692" y="282" width="118" height="78" rx="2"/>
<text class="hltext name" x="751" y="314" text-anchor="middle">PMP control</text>
<text class="hltext sub" x="751" y="332" text-anchor="middle">reprogrammed</text>
<text class="hltext sub" x="751" y="346" text-anchor="middle">per switch</text>

<rect class="hl" x="822" y="282" width="118" height="78" rx="2"/>
<text class="hltext name" x="881" y="314" text-anchor="middle">Boot checks</text>
<text class="hltext sub" x="881" y="332" text-anchor="middle">capabilities,</text>
<text class="hltext sub" x="881" y="346" text-anchor="middle">channels, layout</text>

<line class="rule" x1="20" y1="378" x2="940" y2="378" stroke-width="1"/>

<!-- Hardware row -->
<rect class="hw" x="170" y="394" width="770" height="50" rx="2"/>
<line class="rule" x1="362" y1="394" x2="362" y2="444" stroke-width="1"/>
<line class="rule" x1="555" y1="394" x2="555" y2="444" stroke-width="1"/>
<line class="rule" x1="747" y1="394" x2="747" y2="444" stroke-width="1"/>
<text class="fg" x="266" y="424" text-anchor="middle">CLINT timer, 1 ms</text>
<text class="fg" x="458" y="424" text-anchor="middle">16550 UART</text>
<text class="fg" x="651" y="424" text-anchor="middle">PMP, 16 entries</text>
<text class="fg" x="843" y="424" text-anchor="middle">256 KB RAM, 512 KB flash</text>

<!-- Legend -->
<rect class="hl" x="170" y="468" width="12" height="12" rx="1"/>
<text class="muted sub" x="188" y="478">FerretOS mechanism</text>
<rect class="blk" x="330" y="468" width="12" height="12" rx="1"/>
<text class="muted sub" x="348" y="478">conventional component</text>
<rect class="region" x="510" y="468" width="12" height="12" rx="1" stroke-width="1.25"/>
<text class="muted sub" x="528" y="478">hardware-enforced memory region</text>
</svg>
