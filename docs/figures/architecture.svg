<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520"
     font-family="'Courier New', Courier, monospace" font-size="13">

  <!-- Background -->
  <rect width="640" height="520" fill="#0d1117"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">FerretOS Architecture</text>

  <!-- ── Layer 1: OML Toolchain (build-time) ── -->
  <rect x="60" y="58" width="520" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" fill="#8b949e" font-size="11" letter-spacing="1">BUILD-TIME</text>

  <!-- OML box -->
  <rect x="80" y="90" width="190" height="64" rx="6" fill="#0d419d" stroke="#388bfd" stroke-width="1.5"/>
  <text x="175" y="112" text-anchor="middle" fill="#cae8ff" font-weight="bold">OML Toolchain</text>
  <text x="175" y="130" text-anchor="middle" fill="#79c0ff" font-size="11">tasks/*.oml</text>
  <text x="175" y="146" text-anchor="middle" fill="#79c0ff" font-size="11">task.oml · demo_tasks.oml</text>

  <!-- Arrow OML → Generated -->
  <line x1="270" y1="122" x2="340" y2="122" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="305" y="115" text-anchor="middle" fill="#388bfd" font-size="10">generates</text>

  <!-- Generated code box -->
  <rect x="340" y="90" width="220" height="64" rx="6" fill="#0d1a0d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="112" text-anchor="middle" fill="#aff5b4" font-weight="bold">Generated Rust</text>
  <text x="450" y="130" text-anchor="middle" fill="#7ee787" font-size="11">src/generated/task_schema.rs</text>
  <text x="450" y="146" text-anchor="middle" fill="#7ee787" font-size="11">src/generated/demo_tasks.rs</text>

  <!-- ── Arrow layer 1 → layer 2 ── -->
  <line x1="320" y1="168" x2="320" y2="200" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="338" y="188" fill="#6e7681" font-size="10">compiled into kernel</text>

  <!-- ── Layer 2: Boot-time ── -->
  <rect x="60" y="202" width="520" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="224" text-anchor="middle" fill="#8b949e" font-size="11" letter-spacing="1">BOOT-TIME</text>

  <!-- Task Registry box -->
  <rect x="80" y="234" width="180" height="80" rx="6" fill="#1a1000" stroke="#d29922" stroke-width="1.5"/>
  <text x="170" y="256" text-anchor="middle" fill="#f0c000" font-weight="bold">Task Registry</text>
  <text x="170" y="273" text-anchor="middle" fill="#e3b341" font-size="11">TaskDescriptor × N</text>
  <text x="170" y="289" text-anchor="middle" fill="#e3b341" font-size="11">excl_caps · req_caps · MIP</text>
  <text x="170" y="305" text-anchor="middle" fill="#e3b341" font-size="11">register_task(…)</text>

  <!-- Arrow Registry → CCG -->
  <line x1="260" y1="274" x2="318" y2="274" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="289" y="267" text-anchor="middle" fill="#d29922" font-size="10">builds</text>

  <!-- CCG box -->
  <rect x="318" y="234" width="120" height="80" rx="6" fill="#12001a" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="378" y="256" text-anchor="middle" fill="#d2a8ff" font-weight="bold">CCG</text>
  <text x="378" y="273" text-anchor="middle" fill="#c084fc" font-size="11">L→H edges</text>
  <text x="378" y="289" text-anchor="middle" fill="#c084fc" font-size="11">O(N²) build</text>
  <text x="378" y="305" text-anchor="middle" fill="#c084fc" font-size="11">BFS MIP O(N³)</text>

  <!-- Arrow CCG → Scheduler -->
  <line x1="438" y1="274" x2="494" y2="274" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="466" y="267" text-anchor="middle" fill="#bc8cff" font-size="10">seeds</text>

  <!-- Scheduler init box -->
  <rect x="494" y="234" width="76" height="80" rx="6" fill="#0d1a1a" stroke="#39d3f0" stroke-width="1.5"/>
  <text x="532" y="256" text-anchor="middle" fill="#76e3f8" font-weight="bold" font-size="12">Sched</text>
  <text x="532" y="272" text-anchor="middle" fill="#56d4f0" font-size="11">init</text>
  <text x="532" y="288" text-anchor="middle" fill="#56d4f0" font-size="10">eff_pri</text>
  <text x="532" y="304" text-anchor="middle" fill="#56d4f0" font-size="10">const</text>

  <!-- ── Arrow layer 2 → layer 3 ── -->
  <line x1="320" y1="328" x2="320" y2="360" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="338" y="348" fill="#6e7681" font-size="10">runtime</text>

  <!-- ── Layer 3: Ferret Kernel Runtime ── -->
  <rect x="60" y="362" width="520" height="136" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="384" text-anchor="middle" fill="#8b949e" font-size="11" letter-spacing="1">RUNTIME</text>

  <!-- Scheduler box -->
  <rect x="80" y="394" width="148" height="88" rx="6" fill="#0d1a1a" stroke="#39d3f0" stroke-width="1.5"/>
  <text x="154" y="414" text-anchor="middle" fill="#76e3f8" font-weight="bold">Scheduler</text>
  <text x="154" y="432" text-anchor="middle" fill="#56d4f0" font-size="11">CA-PIP tick()</text>
  <text x="154" y="448" text-anchor="middle" fill="#56d4f0" font-size="11">eff_pri compare</text>
  <text x="154" y="464" text-anchor="middle" fill="#56d4f0" font-size="11">context switch</text>
  <text x="154" y="480" text-anchor="middle" fill="#56d4f0" font-size="11">CLINT 1 ms tick</text>

  <!-- Memory box -->
  <rect x="246" y="394" width="148" height="88" rx="6" fill="#1a0d0d" stroke="#f85149" stroke-width="1.5"/>
  <text x="320" y="414" text-anchor="middle" fill="#ff7b72" font-weight="bold">Memory</text>
  <text x="320" y="432" text-anchor="middle" fill="#ffa198" font-size="11">MemoryRegion ZST</text>
  <text x="320" y="448" text-anchor="middle" fill="#ffa198" font-size="11">Stack&lt;N&gt; 16B align</text>
  <text x="320" y="464" text-anchor="middle" fill="#ffa198" font-size="11">Capability ZST</text>
  <text x="320" y="480" text-anchor="middle" fill="#ffa198" font-size="11">conflict detector</text>

  <!-- IRQ/Context box -->
  <rect x="412" y="394" width="148" height="88" rx="6" fill="#1a1200" stroke="#e3b341" stroke-width="1.5"/>
  <text x="486" y="414" text-anchor="middle" fill="#f0c000" font-weight="bold">IRQ / Context</text>
  <text x="486" y="432" text-anchor="middle" fill="#e3b341" font-size="11">TrapFrame 32 GPR</text>
  <text x="486" y="448" text-anchor="middle" fill="#e3b341" font-size="11">__trap_entry asm</text>
  <text x="486" y="464" text-anchor="middle" fill="#e3b341" font-size="11">__context_switch</text>
  <text x="486" y="480" text-anchor="middle" fill="#e3b341" font-size="11">mepc · mstatus</text>

  <!-- ── Arrow defs ── -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#388bfd"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6e7681"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d29922"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#bc8cff"/>
    </marker>
  </defs>
</svg>
