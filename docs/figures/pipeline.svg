<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170"
     font-family="Arial, Helvetica, sans-serif">
<style>
  .bg{fill:#ffffff} .fg{fill:#1a1a1a} .muted{fill:#666666}
  .blk{fill:#f2f2f2;stroke:#bfbfbf} .hl{fill:#76b900;stroke:#76b900} .hltext{fill:#000000}
  .slot{fill:#ffffff;stroke:#808080} .slotfull{fill:#76b900;stroke:#808080}
  .line{stroke:#808080;fill:none} .head{fill:#808080}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .fg{fill:#ededed} .muted{fill:#a0a0a0}
    .blk{fill:#1c2128;stroke:#444c56} .slot{fill:#0d1117;stroke:#8b949e} .slotfull{stroke:#8b949e}
    .line{stroke:#8b949e} .head{fill:#8b949e}
  }
  text{font-size:12px} .name{font-size:13px;font-weight:700} .sub{font-size:11px}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="960" height="170"/>

<!-- sensor_reader (highest priority, highlighted) -->
<rect class="hl" x="20" y="30" width="200" height="70" rx="2"/>
<text class="hltext name" x="120" y="60" text-anchor="middle">sensor_reader</text>
<text class="hltext sub" x="120" y="80" text-anchor="middle">priority 3</text>
<text class="muted sub" x="120" y="122" text-anchor="middle">samples every 10 ms</text>
<text class="muted sub" x="120" y="138" text-anchor="middle">non-blocking send</text>

<!-- channel 0: eight-slot queue -->
<line class="line" x1="220" y1="65" x2="262" y2="65" stroke-width="1.25" marker-end="url(#a)"/>
<g>
  <rect class="slotfull" x="264" y="53" width="12" height="24"/>
  <rect class="slotfull" x="276" y="53" width="12" height="24"/>
  <rect class="slot" x="288" y="53" width="12" height="24"/>
  <rect class="slot" x="300" y="53" width="12" height="24"/>
  <rect class="slot" x="312" y="53" width="12" height="24"/>
  <rect class="slot" x="324" y="53" width="12" height="24"/>
  <rect class="slot" x="336" y="53" width="12" height="24"/>
  <rect class="slot" x="348" y="53" width="12" height="24"/>
</g>
<text class="fg name" x="312" y="44" text-anchor="middle">channel 0</text>
<text class="muted sub" x="312" y="96" text-anchor="middle">8 × 16 B, in kernel</text>
<line class="line" x1="360" y1="65" x2="398" y2="65" stroke-width="1.25" marker-end="url(#a)"/>

<!-- filter -->
<rect class="blk" x="400" y="30" width="200" height="70" rx="2"/>
<text class="fg name" x="500" y="60" text-anchor="middle">filter</text>
<text class="muted sub" x="500" y="80" text-anchor="middle">priority 2</text>
<text class="muted sub" x="500" y="122" text-anchor="middle">4-sample moving average</text>
<text class="muted sub" x="500" y="138" text-anchor="middle">blocks until data arrives</text>

<!-- channel 1 -->
<line class="line" x1="600" y1="65" x2="642" y2="65" stroke-width="1.25" marker-end="url(#a)"/>
<g>
  <rect class="slotfull" x="644" y="53" width="12" height="24"/>
  <rect class="slotfull" x="656" y="53" width="12" height="24"/>
  <rect class="slotfull" x="668" y="53" width="12" height="24"/>
  <rect class="slot" x="680" y="53" width="12" height="24"/>
  <rect class="slot" x="692" y="53" width="12" height="24"/>
  <rect class="slot" x="704" y="53" width="12" height="24"/>
  <rect class="slot" x="716" y="53" width="12" height="24"/>
  <rect class="slot" x="728" y="53" width="12" height="24"/>
</g>
<text class="fg name" x="692" y="44" text-anchor="middle">channel 1</text>
<text class="muted sub" x="692" y="96" text-anchor="middle">absorbs logger backlog</text>
<line class="line" x1="740" y1="65" x2="758" y2="65" stroke-width="1.25" marker-end="url(#a)"/>

<!-- uart_logger -->
<rect class="blk" x="760" y="30" width="180" height="70" rx="2"/>
<text class="fg name" x="850" y="60" text-anchor="middle">uart_logger</text>
<text class="muted sub" x="850" y="80" text-anchor="middle">priority 1</text>
<text class="muted sub" x="850" y="122" text-anchor="middle">3 ms per line, plus a</text>
<text class="muted sub" x="850" y="138" text-anchor="middle">25 ms flush every 5 lines</text>
</svg>
