<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#ffffff} .fg{fill:#1f2328} .muted{fill:#59636e} .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .s3{fill:#dafbe1;stroke:#1a7f37} .s2{fill:#ddf4ff;stroke:#0969da} .s1{fill:#fff1e5;stroke:#bc4c00}
  .ch{fill:#f6f8fa;stroke:#8250df} .chtext{fill:#8250df}
  .arrow{stroke:#59636e;fill:none} .head{fill:#59636e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .fg{fill:#e6edf3} .muted{fill:#9198a1}
    .s3{fill:#0f3d1e;stroke:#3fb950} .s2{fill:#0c2d6b;stroke:#4493f8} .s1{fill:#3d1d00;stroke:#f0883e}
    .ch{fill:#151b23;stroke:#ab7df8} .chtext{fill:#ab7df8}
    .arrow{stroke:#9198a1} .head{fill:#9198a1}
  }
  text{font-size:13px} .t{font-weight:600;font-size:15px} .s{font-size:12px}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="900" height="250" rx="8"/>
<text class="fg" x="20" y="30" font-size="16" font-weight="600">Sensor-fusion pipeline</text>
<text class="muted" x="20" y="50" font-size="12">Data flows from high to low priority. Every message moves through a kernel channel; no task can touch another's memory.</text>

<rect class="s3" x="20" y="76" width="210" height="104" rx="8" stroke-width="1.5"/>
<text class="fg t" x="125" y="102" text-anchor="middle">sensor_reader</text>
<text class="fg s" x="125" y="124" text-anchor="middle">priority 3 (highest)</text>
<text class="muted s" x="125" y="143" text-anchor="middle">samples every 10 ms</text>
<text class="muted s" x="125" y="162" text-anchor="middle">try_send: never blocks</text>

<rect class="ch" x="262" y="102" width="92" height="52" rx="26" stroke-width="1.5"/>
<text class="chtext" x="308" y="124" text-anchor="middle" font-weight="600">ch 0</text>
<text class="muted s" x="308" y="142" text-anchor="middle">8 × 16 B</text>
<line class="arrow" x1="230" y1="128" x2="260" y2="128" stroke-width="1.5" marker-end="url(#a)"/>
<line class="arrow" x1="354" y1="128" x2="384" y2="128" stroke-width="1.5" marker-end="url(#a)"/>

<rect class="s2" x="386" y="76" width="210" height="104" rx="8" stroke-width="1.5"/>
<text class="fg t" x="491" y="102" text-anchor="middle">filter</text>
<text class="fg s" x="491" y="124" text-anchor="middle">priority 2</text>
<text class="muted s" x="491" y="143" text-anchor="middle">4-sample moving average</text>
<text class="muted s" x="491" y="162" text-anchor="middle">blocks until data arrives</text>

<rect class="ch" x="628" y="102" width="92" height="52" rx="26" stroke-width="1.5"/>
<text class="chtext" x="674" y="124" text-anchor="middle" font-weight="600">ch 1</text>
<text class="muted s" x="674" y="142" text-anchor="middle">8 × 16 B</text>
<line class="arrow" x1="596" y1="128" x2="626" y2="128" stroke-width="1.5" marker-end="url(#a)"/>
<line class="arrow" x1="720" y1="128" x2="750" y2="128" stroke-width="1.5" marker-end="url(#a)"/>

<rect class="s1" x="752" y="76" width="128" height="104" rx="8" stroke-width="1.5"/>
<text class="fg t" x="816" y="102" text-anchor="middle">uart_logger</text>
<text class="fg s" x="816" y="124" text-anchor="middle">priority 1</text>
<text class="muted s" x="816" y="143" text-anchor="middle">3 ms per line</text>
<text class="muted s" x="816" y="162" text-anchor="middle">+25 ms every 5th</text>

<text class="fg s" x="20" y="212" font-weight="600">What it shows</text>
<text class="muted s" x="20" y="232">IPC under isolation (U-mode + PMP), and CA-PIP keeping the high-priority sensor on time while the logger is busy: 0 deadline misses, latency ≤ 1 tick.</text>
</svg>
