<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 272" width="900" height="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#ffffff} .fg{fill:#1f2328} .muted{fill:#59636e} .grid{stroke:#d1d9e0}
  .rowbg{fill:#f6f8fa} .work{fill:#e8a33d} .flush{fill:#bc4c00} .ok{fill:#1a7f37} .late{fill:#cf222e}
  .rel{stroke:#1a7f37}
