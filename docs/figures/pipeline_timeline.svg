    .bg{fill:#0d1117} .fg{fill:#e6edf3} .muted{fill:#9198a1} .grid{stroke:#3d444d}
    .rowbg{fill:#151b23} .work{fill:#d29922} .flush{fill:#f0883e} .ok{fill:#3fb950} .late{fill:#f85149}
