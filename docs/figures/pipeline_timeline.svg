<line class="rel" x1="157" y1="240" x2="157" y2="254" stroke-width="1.5" stroke-dasharray="3 3"/>
<text class="muted" x="170" y="251" font-size="12">sensor release that falls inside a flush: the sensor preempts the logger and still runs on time</text>
